<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Título/nombre reales vienen de data/config.json vía js/app.js (aplicarConfigShell) --
         este es solo el valor antes de que cargue JS. -->
    <title>Hey!</title>
    <meta name="description" content="App personal para practicar inglés, con progreso medido en niveles CEFR (A1-C2)." />
    <!-- Solo modo oscuro por ahora (ver css/styles.css) -- un único theme-color, sin
         distinguir claro/oscuro todavía. -->
    <meta name="theme-color" content="#12122a" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hey!" />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="banner-plan" class="banner-plan" hidden aria-live="polite"></div>
      <main id="pantalla" role="main" aria-live="polite"></main>
      <nav class="tabs" aria-label="Navegación principal">
        <div class="marca-sidebar" id="marca-sidebar"></div>
        <button type="button" data-ruta="inicio">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
              ><path d="M4 11.5 12 4l8 7.5" /><path d="M6 10v9h12v-9"
            /></svg
          ></span>
          <span data-i18n="nav.inicio">Inicio</span>
        </button>
        <button type="button" data-ruta="repaso">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
              ><path
                d="M8.25 18.5 L9.36 19.02 L10.54 19.36 L11.75 19.5 L12.98 19.44 L14.18 19.18 L15.32 18.73 L16.37 18.1 L17.3 17.3 L18.1 16.37 L18.73 15.32 L19.18 14.18 L19.44 12.98 L19.5 11.75 L19.36 10.54 L19.02 9.36 L18.5 8.25"
              /><path d="M18.5 8.25 L20.7 9.63 M18.5 8.25 L18.59 10.85" /><path
                d="M15.75 5.5 L14.64 4.98 L13.46 4.64 L12.25 4.5 L11.02 4.56 L9.82 4.82 L8.68 5.27 L7.63 5.9 L6.7 6.7 L5.9 7.63 L5.27 8.68 L4.82 9.82 L4.56 11.02 L4.5 12.25 L4.64 13.46 L4.98 14.64 L5.5 15.75"
              /><path d="M5.5 15.75 L3.3 14.37 M5.5 15.75 L5.41 13.15"
            /></svg
          ></span>
          <span data-i18n="nav.repaso">Repaso</span>
        </button>
        <button type="button" data-ruta="diagnostico">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
              ><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.5 2.5L16 9.5"
            /></svg
          ></span>
          <span data-i18n="nav.diagnostico">Diagnóstico</span>
        </button>
        <button type="button" data-ruta="progreso">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
              ><path d="M4 18V9" /><path d="M11 18V5" /><path d="M18 18v-7"
            /></svg
          ></span>
          <span data-i18n="nav.progreso">Progreso</span>
        </button>
        <button type="button" data-ruta="ajustes">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
              ><path d="M3 6h18" /><circle cx="14" cy="6" r="2.3" /><path d="M3 12h18" /><circle cx="9" cy="12" r="2.3" /><path
                d="M3 18h18"
              /><circle cx="17" cy="18" r="2.3" /></svg
          ></span>
          <span data-i18n="nav.ajustes">Ajustes</span>
        </button>
      </nav>
    </div>

    <script src="js/core/util.js"></script>
    <script src="js/core/iconos.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/core/fecha.js"></script>
    <script src="js/core/racha.js"></script>
    <script src="js/core/xp.js"></script>
    <script src="js/core/srs.js"></script>
    <script src="js/core/diagnostico.js"></script>
    <script src="js/core/progreso.js"></script>
    <script src="js/core/tts.js"></script>
    <script src="js/core/avance.js"></script>
    <script src="js/core/plan.js"></script>
    <script src="js/core/habla.js"></script>
    <script src="js/core/ia.js"></script>
    <script src="js/core/conversacion.js"></script>
    <script src="js/core/datos.js"></script>
    <script src="js/screens/habla.js"></script>
    <script src="js/screens/conversacion.js"></script>
    <script src="js/screens/inicio.js"></script>
    <script src="js/screens/repaso.js"></script>
    <script src="js/screens/diagnostico.js"></script>
    <script src="js/screens/progreso.js"></script>
    <script src="js/screens/ajustes.js"></script>
    <script src="js/screens/practicar.js"></script>
    <script src="js/screens/lectura.js"></script>
    <script src="js/screens/escucha.js"></script>
    <script src="js/screens/escritura.js"></script>
    <script src="js/screens/confirmacion.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
