<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Inglés B2</title>
    <meta name="description" content="App personal para practicar inglés hacia nivel B2 (CEFR)." />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inglés B2" />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app">
      <main id="pantalla" role="main" aria-live="polite"></main>
      <nav class="tabs" aria-label="Navegación principal">
        <button type="button" data-ruta="inicio">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
              ><path d="M4 11.5 12 4l8 7.5" /><path d="M6 10v9h12v-9"
            /></svg
          ></span>
          <span data-i18n="nav.inicio">Inicio</span>
        </button>
        <button type="button" data-ruta="repaso">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
              ><path d="M4 7a6 6 0 0 1 10-4.5L16 4" /><path d="M20 17a6 6 0 0 1-10 4.5L8 20" /><path d="M14 2v4h-4" /><path d="M10 22v-4h4"
            /></svg
          ></span>
          <span data-i18n="nav.repaso">Repaso</span>
        </button>
        <button type="button" data-ruta="diagnostico">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
              ><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.5 2.5L16 9.5"
            /></svg
          ></span>
          <span data-i18n="nav.diagnostico">Diagnóstico</span>
        </button>
        <button type="button" data-ruta="progreso">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
              ><path d="M4 18V9" /><path d="M11 18V5" /><path d="M18 18v-7"
            /></svg
          ></span>
          <span data-i18n="nav.progreso">Progreso</span>
        </button>
        <button type="button" data-ruta="ajustes">
          <span class="icono" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
              ><circle cx="12" cy="12" r="3" /><path
                d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.4-2-3.4-2.3.8a8 8 0 0 0-1.7-1l-.4-2.4h-4l-.4 2.4a8 8 0 0 0-1.7 1l-2.3-.8-2 3.4L4.6 11a7.9 7.9 0 0 0 0 2l-2 1.4 2 3.4 2.3-.8a8 8 0 0 0 1.7 1l.4 2.4h4l.4-2.4a8 8 0 0 0 1.7-1l2.3.8 2-3.4z"
              /></svg
          ></span>
          <span data-i18n="nav.ajustes">Ajustes</span>
        </button>
      </nav>
    </div>

    <script src="js/core/util.js"></script>
    <script src="js/core/iconos.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/core/fecha.js"></script>
    <script src="js/core/racha.js"></script>
    <script src="js/core/xp.js"></script>
    <script src="js/core/srs.js"></script>
    <script src="js/core/diagnostico.js"></script>
    <script src="js/core/progreso.js"></script>
    <script src="js/core/tts.js"></script>
    <script src="js/core/datos.js"></script>
    <script src="js/screens/inicio.js"></script>
    <script src="js/screens/repaso.js"></script>
    <script src="js/screens/diagnostico.js"></script>
    <script src="js/screens/progreso.js"></script>
    <script src="js/screens/ajustes.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
