<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pruebas de integración — capa de datos</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #18181b;
        color: #ececea;
        font-family: -apple-system, system-ui, sans-serif;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.3rem;
      }
      p.intro {
        color: #9a9a96;
        max-width: 640px;
      }
      button {
        min-height: 44px;
        padding: 10px 20px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        border: none;
        background: #e8a93d;
        color: #1a1200;
        cursor: pointer;
      }
      #resumen {
        margin: 16px 0;
        font-weight: 600;
        font-size: 1.1rem;
      }
      ul {
        list-style: none;
        padding: 0;
        max-width: 760px;
      }
      li {
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 6px;
        border: 1px solid #313136;
      }
      li.ok {
        border-color: #6fcf97;
      }
      li.fail {
        border-color: #ff8a80;
      }
      li .nombre {
        font-weight: 600;
      }
      li .detalle {
        display: block;
        font-size: 0.85rem;
        color: #9a9a96;
        white-space: pre-wrap;
        margin-top: 4px;
      }
      li.fail .detalle {
        color: #ff8a80;
      }
    </style>
  </head>
  <body>
    <h1>Pruebas de integración — capa de datos (IndexedDB real)</h1>
    <p class="intro">
      Corren contra IndexedDB de verdad, en una base de datos de pruebas separada
      (<code id="nombre-db-mostrado"></code>) que nunca toca tus datos reales de la app. Cada
      corrida la borra al terminar. Ver <code>CLAUDE.md</code> para cómo abrir esta página.
    </p>
    <button type="button" id="btn-correr">Correr todas las pruebas</button>
    <p id="resumen"></p>
    <ul id="lista-resultados"></ul>

    <script src="../js/core/tema.js"></script>
    <script src="../js/core/util.js"></script>
    <script src="../js/core/storage.js"></script>
    <script src="../js/core/fecha.js"></script>
    <script src="../js/core/racha.js"></script>
    <script src="../js/core/xp.js"></script>
    <script src="../js/core/srs.js"></script>
    <script src="../js/core/diagnostico.js"></script>
    <script src="../js/core/progreso.js"></script>
    <script src="../js/core/avance.js"></script>
    <script src="../js/core/plan.js"></script>
    <script src="../js/core/recordatorio.js"></script>
    <script src="../js/core/datos.js"></script>
    <script>
      "use strict";

      // Base de datos de pruebas, independiente de "app-ingles" (la real). Nunca se toca la
      // real: App.Storage se cambia temporalmente a esta instancia mientras corre la
      // batería (App.Datos usa `global.App.Storage.xxx` en cada llamada, así que basta con
      // reemplazar la referencia; no hace falta tocar datos.js). Se restaura al terminar,
      // pase lo que pase, y la base de prueba se borra entera al final.
      var NOMBRE_DB_PRUEBA = "app-ingles-integracion-" + Date.now();
      document.getElementById("nombre-db-mostrado").textContent = NOMBRE_DB_PRUEBA;
      var storageReal = App.Storage;
      var storagePrueba = App.Storage.crear(NOMBRE_DB_PRUEBA, 3);

      var pruebas = [];
      function prueba(nombre, fn) {
        pruebas.push({ nombre: nombre, fn: fn });
      }

      function limpiarStores(nombres) {
        return Promise.all(nombres.map(function (n) { return App.Storage.clearStore(n); }));
      }

      function assertEqual(actual, esperado, mensaje) {
        var a = JSON.stringify(actual);
        var e = JSON.stringify(esperado);
        if (a !== e) throw new Error((mensaje ? mensaje + " — " : "") + "esperado " + e + " pero fue " + a);
      }
      function assertTrue(valor, mensaje) {
        if (!valor) throw new Error(mensaje || "se esperaba un valor verdadero");
      }

      // --- 1. Guardar y leer sesión del día ---
      prueba("guardar y leer la sesión del día", function () {
        return limpiarStores(["sesiones"]).then(function () {
          var hoy = App.Fecha.hoyISO();
          return App.Storage.put("sesiones", { id: hoy, minutos: 12, metaCumplida: false, ejerciciosCorrectos: 2 })
            .then(function () {
              return App.Storage.get("sesiones", hoy);
            })
            .then(function (fila) {
              assertEqual(fila.minutos, 12);
              assertEqual(fila.ejerciciosCorrectos, 2);
            });
        });
      });

      // --- 2. Sumar minutos y XP a través de App.Datos.registrarSesion ---
      prueba("registrarSesion suma minutos y XP del mismo día", function () {
        return limpiarStores(["sesiones", "xp"]).then(function () {
          return App.Datos.registrarSesion(5, 1, new Date(2026, 10, 10, 9, 0))
            .then(function () {
              return App.Datos.registrarSesion(7, 2, new Date(2026, 10, 10, 18, 0));
            })
            .then(function (resultado) {
              assertEqual(resultado.minutosHoy, 12);
              return App.Storage.get("sesiones", "2026-11-10");
            })
            .then(function (fila) {
              assertEqual(fila.minutos, 12);
              assertEqual(fila.ejerciciosCorrectos, 3);
              return App.Datos.obtenerXP();
            })
            .then(function (xp) {
              assertTrue(xp.total > 0, "el XP total debería ser mayor que 0 tras 2 sesiones");
            });
        });
      });

      // --- 3. Cambio de día: cada fecha tiene su propio registro ---
      prueba("cambio de día: dos fechas quedan separadas", function () {
        return limpiarStores(["sesiones", "xp"]).then(function () {
          return App.Datos.registrarSesion(5, 0, new Date(2026, 10, 10, 10, 0))
            .then(function () {
              return App.Datos.registrarSesion(8, 0, new Date(2026, 10, 11, 10, 0));
            })
            .then(function () {
              return App.Datos.obtenerMinutosPorDia();
            })
            .then(function (mapa) {
              assertEqual(mapa["2026-11-10"], 5);
              assertEqual(mapa["2026-11-11"], 8);
            });
        });
      });

      // --- 4. Racha: con y sin mínimo cumplido ---
      prueba("racha: varios días bajo el mínimo agotan los congelamientos y rompen la racha", function () {
        return limpiarStores(["sesiones"]).then(function () {
          return Promise.all([
            App.Storage.put("sesiones", { id: "2026-11-10", minutos: 5 }), // cumple -> racha 1
            App.Storage.put("sesiones", { id: "2026-11-11", minutos: 2 }), // no cumple -> congelamiento 2->1
            App.Storage.put("sesiones", { id: "2026-11-12", minutos: 2 }), // no cumple -> congelamiento 1->0
            App.Storage.put("sesiones", { id: "2026-11-13", minutos: 2 }) // no cumple, sin congelamientos -> rompe
          ]).then(function () {
            return App.Datos.obtenerEstadoRacha(new Date(2026, 10, 13));
          });
        }).then(function (racha) {
          assertEqual(racha.rachaActual, 0);
        });
      });

      // --- 5. Congelaciones: un día sin registro se cubre con una congelación ---
      prueba("racha: un día saltado se cubre con una congelación disponible", function () {
        return limpiarStores(["sesiones"]).then(function () {
          return Promise.all([
            App.Storage.put("sesiones", { id: "2026-11-10", minutos: 10 }),
            App.Storage.put("sesiones", { id: "2026-11-11", minutos: 10 })
            // falta el 12 por completo (no bajo el mínimo: directamente no hay registro)
          ]).then(function () {
            return App.Storage.put("sesiones", { id: "2026-11-13", minutos: 10 });
          }).then(function () {
            return App.Datos.obtenerEstadoRacha(new Date(2026, 10, 13));
          });
        }).then(function (racha) {
          // 10(racha=1), 11(racha=2), 12 sin registro pero cubierto por congelamiento inicial, 13(racha=3)
          assertEqual(racha.rachaActual, 3);
        });
      });

      // --- 6. Exportar e importar respaldo: debe quedar igual ---
      prueba("exportar e importar un respaldo deja los datos igual", function () {
        return limpiarStores(App.Storage.STORES).then(function () {
          return Promise.all([
            App.Storage.put("xp", { id: "actual", total: 250 }),
            App.Storage.put("sesiones", { id: "2026-11-10", minutos: 15, metaCumplida: true }),
            App.Storage.put("srs_cards", { id: "voc-1", frente: "deadline", atras: "fecha límite" })
          ]);
        }).then(function () {
          return App.Storage.exportBackup();
        }).then(function (respaldo) {
          return limpiarStores(App.Storage.STORES).then(function () {
            return App.Storage.importBackup(respaldo);
          });
        }).then(function () {
          return Promise.all([App.Storage.get("xp", "actual"), App.Storage.get("sesiones", "2026-11-10"), App.Storage.get("srs_cards", "voc-1")]);
        }).then(function (res) {
          assertEqual(res[0].total, 250);
          assertEqual(res[1].minutos, 15);
          assertEqual(res[2].frente, "deadline");
        });
      });

      // --- 7. Respaldo malformado o con HTML no rompe nada ni se ejecuta ---
      prueba("respaldo malformado: se rechaza sin romper nada", function () {
        return App.Storage.importBackup({ noEsUnRespaldoValido: true }).then(
          function () {
            throw new Error("debería haber rechazado un respaldo sin 'datos'");
          },
          function (err) {
            assertTrue(err instanceof Error);
          }
        );
      });

      prueba("respaldo con HTML se guarda como texto inerte, no se ejecuta", function () {
        var payload = '<img src=x onerror="window.__xssEjecutado = true">';
        return limpiarStores(["srs_cards"]).then(function () {
          return App.Storage.importBackup({ datos: { srs_cards: [{ id: "voc-xss", frente: payload, atras: "ok" }] } });
        }).then(function () {
          return App.Storage.get("srs_cards", "voc-xss");
        }).then(function (fila) {
          // IndexedDB solo guarda texto: no hay forma de que esto "se ejecute" aquí. El
          // riesgo real está al RENDERIZAR este campo (ver DECISIONES.md D10, ya arreglado
          // con App.Util.escaparHTML en las pantallas) -- esta prueba solo confirma que
          // guardarlo/leerlo no rompe ni altera el contenido.
          assertEqual(fila.frente, payload);
          assertTrue(!window.__xssEjecutado, "el payload no debió ejecutarse nunca");
        });
      });

      // --- 8. Repaso: crear tarjeta, calificar con SM-2, persistir y recargar ---
      prueba("repaso: tarjeta nueva, calificada y recargada desde IndexedDB", function () {
        return limpiarStores(["srs_cards"]).then(function () {
          var tarjeta = App.SRS.tarjetaNueva("voc-999", new Date(2026, 10, 10));
          tarjeta.frente = "deadline";
          tarjeta.atras = "fecha límite";
          var calificada = App.SRS.calificarTarjeta(tarjeta, 4, new Date(2026, 10, 10));
          calificada.frente = tarjeta.frente;
          calificada.atras = tarjeta.atras;
          return App.Storage.put("srs_cards", calificada);
        }).then(function () {
          return App.Storage.get("srs_cards", "voc-999");
        }).then(function (recargada) {
          assertEqual(recargada.repeticiones, 1);
          assertEqual(recargada.intervaloDias, 1);
          assertEqual(recargada.frente, "deadline");
        });
      });

      // --- 9. Plan: sin diagnóstico, el plan guardado es solo "Diagnóstico" ---
      prueba("plan: sin diagnóstico, se guarda un plan de un solo paso", function () {
        return limpiarStores(["plan", "diagnostico_resultados", "srs_cards", "settings"]).then(function () {
          return App.Datos.obtenerOCalcularPlanDeHoy(new Date(2026, 10, 18));
        }).then(function (plan) {
          assertEqual(plan.pasos.length, 1);
          assertEqual(plan.pasos[0].tipo, "diagnostico");
        });
      });

      // --- 10. Plan: determinista, no se recalcula si ya existe uno guardado para hoy ---
      prueba("plan: se calcula una sola vez por día, no cambia al pedirlo de nuevo", function () {
        var ahora = new Date(2026, 10, 18);
        return limpiarStores(["plan", "diagnostico_resultados", "srs_cards", "settings"]).then(function () {
          return App.Datos.guardarDiagnostico({
            porHabilidad: {
              lectura: { nivelCEFR: "A2" },
              habla: { nivelCEFR: "A2" },
              escucha: { nivelCEFR: "A2" },
              escritura: { nivelCEFR: "A2" }
            }
          });
        }).then(function () {
          return App.Datos.obtenerOCalcularPlanDeHoy(ahora);
        }).then(function (plan1) {
          // Una práctica extra el mismo día (ver Practicar, Fase B) no debe alterar el plan
          // ya guardado -- solo cuenta para XP/minutos/última práctica.
          return App.Datos.registrarSesion(8, 1, ahora, "lectura").then(function () {
            return App.Datos.obtenerOCalcularPlanDeHoy(ahora);
          }).then(function (plan2) {
            assertEqual(JSON.stringify(plan1), JSON.stringify(plan2));
          });
        });
      });

      // --- 11. Plan: marcar un paso completado persiste y sobrevive una relectura ---
      prueba("plan: marcarPasoCompletado persiste tras recargar", function () {
        var ahora = new Date(2026, 10, 18);
        return limpiarStores(["plan", "diagnostico_resultados", "srs_cards", "settings"]).then(function () {
          return App.Datos.guardarDiagnostico({
            porHabilidad: {
              lectura: { nivelCEFR: "A2" },
              habla: { nivelCEFR: "A2" },
              escucha: { nivelCEFR: "A2" },
              escritura: { nivelCEFR: "A2" }
            }
          });
        }).then(function () {
          return App.Datos.obtenerOCalcularPlanDeHoy(ahora);
        }).then(function (plan) {
          return App.Datos.marcarPasoCompletado(plan.id, 0);
        }).then(function () {
          return App.Datos.obtenerOCalcularPlanDeHoy(ahora);
        }).then(function (planRecargado) {
          assertEqual(planRecargado.pasos[0].completado, true);
          assertEqual(planRecargado.pasos[1].completado, false);
        });
      });

      // --- 12. Plan: tope real de tarjetas vencidas (antes 115 de golpe) ---
      prueba("plan: muchas tarjetas vencidas se topan a 20 en el paso de repaso", function () {
        var ahora = new Date(2026, 10, 18);
        return limpiarStores(["plan", "diagnostico_resultados", "srs_cards", "settings"]).then(function () {
          var puts = [];
          for (var i = 0; i < 30; i++) {
            var t = App.SRS.tarjetaNueva("voc-" + i, new Date(2026, 9, 1));
            t.proximaFecha = "2026-10-01"; // ya vencida para "ahora"
            t.repeticiones = 1; // no cuenta como "nueva"
            puts.push(App.Storage.put("srs_cards", t));
          }
          return Promise.all(puts);
        }).then(function () {
          return App.Datos.guardarDiagnostico({
            porHabilidad: {
              lectura: { nivelCEFR: "A2" },
              habla: { nivelCEFR: "A2" },
              escucha: { nivelCEFR: "A2" },
              escritura: { nivelCEFR: "A2" }
            }
          });
        }).then(function () {
          return App.Datos.obtenerOCalcularPlanDeHoy(ahora);
        }).then(function (plan) {
          var repaso = plan.pasos.filter(function (p) { return p.tipo === "repaso"; })[0];
          assertTrue(!!repaso, "debería haber un paso de repaso");
          assertEqual(repaso.tarjetasVencidas, 20);
        });
      });

      // --- 13. Plan: registrar práctica de una habilidad actualiza su "última práctica" ---
      prueba("registrarPracticaHabilidad: queda guardada y se puede releer", function () {
        return limpiarStores(["settings"]).then(function () {
          return App.Datos.registrarPracticaHabilidad("escucha", new Date(2026, 10, 18));
        }).then(function () {
          return App.Datos.obtenerUltimaPracticaPorHabilidad();
        }).then(function (fechas) {
          assertEqual(fechas.escucha, "2026-11-18");
        });
      });

      // Las pruebas viven en /tests/ pero App.Datos pide el contenido con rutas relativas a la
      // raíz ("data/content/..."): durante la batería, fetch se reescribe a "../" (ver correrTodo).
      function conContenidoDesdeRaiz(fn) {
        return Promise.resolve().then(fn);
      }

      // --- 14. Plan provisional: el plan "solo Diagnóstico" se recalcula en cuanto hay diagnóstico ---
      prueba("plan: el plan solo-Diagnóstico se recalcula al existir un diagnóstico (antes se quedaba todo el día)", function () {
        var ahora = new Date(2026, 10, 18);
        return conContenidoDesdeRaiz(function () {
          return limpiarStores(["plan", "diagnostico_resultados", "srs_cards", "settings"]).then(function () {
            return App.Datos.obtenerOCalcularPlanDeHoy(ahora);
          }).then(function (plan1) {
            assertEqual(plan1.pasos.length, 1);
            assertEqual(plan1.pasos[0].tipo, "diagnostico");
            return App.Datos.guardarDiagnostico({ porHabilidad: {
              lectura: { nivelCEFR: "A2" }, habla: { nivelCEFR: "A2" }, escucha: { nivelCEFR: "A2" }, escritura: { nivelCEFR: "A2" }
            } });
          }).then(function () {
            return App.Datos.obtenerOCalcularPlanDeHoy(ahora);
          }).then(function (plan2) {
            assertTrue(plan2.pasos.length > 1 || plan2.pasos[0].tipo !== "diagnostico", "debería ser el plan real del día");
            return App.Datos.obtenerOCalcularPlanDeHoy(ahora).then(function (plan3) {
              assertEqual(JSON.stringify(plan2), JSON.stringify(plan3)); // y ya es estable (determinista)
            });
          });
        });
      });

      // --- 15. Migración de contenido: sembrar agrega tarjetas nuevas SIN tocar el SM-2 de las existentes ---
      prueba("tarjetas: contenido nuevo se suma y el progreso SM-2 de las ya existentes queda intacto", function () {
        var ahora = new Date(2026, 10, 18);
        return conContenidoDesdeRaiz(function () {
          return limpiarStores(["srs_cards"]).then(function () {
            // Estado "versión anterior": una sola tarjeta con progreso, sin nivelCEFR.
            return App.Storage.put("srs_cards", { id: "voc-voc-f1-1", frente: "viejo", atras: "viejo", tipo: "vocabulario", repeticiones: 4, intervaloDias: 15, facilidad: 2.1, proximaFecha: "2026-12-01" });
          }).then(function () {
            return App.Datos.sembrarTarjetasSiHaceFalta(ahora);
          }).then(function (todas) {
            assertTrue(todas.length > 400, "debería haber sembrado el contenido nuevo (hay " + todas.length + ")");
            var t = todas.filter(function (c) { return c.id === "voc-voc-f1-1"; })[0];
            assertEqual(t.repeticiones, 4);
            assertEqual(t.intervaloDias, 15);
            assertEqual(t.facilidad, 2.1);
            assertEqual(t.proximaFecha, "2026-12-01");
            assertTrue(!!t.nivelCEFR, "debería haberse completado nivelCEFR");
            assertTrue(t.frente !== "viejo", "el texto de contenido se sincroniza");
          });
        });
      });

      // --- 16. Repaso: la cola real respeta 15 nuevas/día y el cupo se guarda por día ---
      prueba("repaso: obtenerColaRepaso topa en 15 nuevas por día y no entrega otras 15 al reabrir", function () {
        var ahora = new Date(2026, 10, 18);
        return conContenidoDesdeRaiz(function () {
          return limpiarStores(["srs_cards", "settings", "diagnostico_resultados"]).then(function () {
            return App.Datos.obtenerColaRepaso(ahora);
          }).then(function (cola1) {
            assertEqual(cola1.length, 15);
            return App.Datos.obtenerColaRepaso(ahora).then(function (cola2) {
              assertEqual(cola2.length, 15); // las mismas 15 (siguen nuevas: no se calificaron), no 30
              var ids1 = cola1.map(function (c) { return c.id; }).sort().join();
              assertEqual(cola2.map(function (c) { return c.id; }).sort().join(), ids1);
              return App.Datos.obtenerColaRepaso(new Date(2026, 10, 19));
            });
          }).then(function (colaManana) {
            assertEqual(colaManana.length, 15); // día nuevo, cupo nuevo
          });
        });
      });

      // --- 17. El plan se recalcula a mitad del flujo (fin del Diagnóstico): no se marca el paso equivocado ---
      prueba("plan: terminar el Diagnóstico NO marca como hecho el primer paso del plan recalculado (Repaso)", function () {
        var ahora = new Date(2026, 10, 18);
        return limpiarStores(["plan", "diagnostico_resultados", "srs_cards", "settings"]).then(function () {
          return App.Datos.obtenerOCalcularPlanDeHoy(ahora); // plan provisional [diagnostico]
        }).then(function () {
          return App.Datos.guardarDiagnostico({ porHabilidad: { lectura: { nivelCEFR: "A2" }, habla: { nivelCEFR: "A2" }, escucha: { nivelCEFR: "A2" }, escritura: { nivelCEFR: "A2" } } });
        }).then(function () {
          return App.Datos.obtenerOCalcularPlanDeHoy(ahora); // ahora SE RECALCULA al plan real
        }).then(function (planReal) {
          assertTrue(planReal.pasos[0].tipo !== "diagnostico", "debería ser el plan real");
          return App.Datos.marcarPasoCompletado(planReal.id, 0, { tipo: "diagnostico", habilidad: null });
        }).then(function (plan) {
          assertEqual(plan.pasos.filter(function (p) { return p.completado; }).length, 0);
        });
      });

      // ===== Avance continuo por habilidad (D29) =====
      var DIAG_A2 = { porHabilidad: { lectura: { nivelCEFR: "A2" }, habla: { nivelCEFR: "A2" }, escucha: { nivelCEFR: "A2" }, escritura: { nivelCEFR: "A2" } } };
      var STORES_AVANCE = ["plan", "diagnostico_resultados", "srs_cards", "settings", "avance", "sesiones", "xp"];

      function responderN(habilidad, nivel, n, valor, ahora) {
        var p = Promise.resolve();
        var ultimo = null;
        for (var i = 0; i < n; i++) {
          p = p.then(function () {
            return App.Datos.registrarRespuestaAvance(habilidad, nivel, valor, 1, ahora).then(function (r) { ultimo = r; });
          });
        }
        return p.then(function () { return ultimo; });
      }

      prueba("avance: sin diagnóstico no se cuenta nada; con diagnóstico solo cuenta el nivel actual", function () {
        var ahora = new Date(2026, 10, 18);
        return limpiarStores(STORES_AVANCE).then(function () {
          return App.Datos.registrarRespuestaAvance("lectura", "A2", 1, 1, ahora);
        }).then(function (r) {
          assertEqual(r.contado, false);
          return App.Datos.guardarDiagnostico(DIAG_A2);
        }).then(function () {
          return App.Datos.registrarRespuestaAvance("lectura", "B1", 1, 1, ahora); // contenido de otro nivel
        }).then(function (r) {
          assertEqual(r.contado, false);
          return App.Datos.registrarRespuestaAvance("lectura", "A2", 1, 1, ahora);
        }).then(function (r) {
          assertEqual(r.contado, true);

      prueba("migración IndexedDB v2 -> v3: agrega 'avance' sin perder ningún dato existente", function () {
        var nombre = "app-ingles-migracion-" + Date.now();
        var storesV2 = ["settings", "racha", "xp", "srs_cards", "diagnostico_resultados", "sesiones", "plan"];
        var instanciaV3 = null;
        return new Promise(function (resolve, reject) {
          var req = indexedDB.open(nombre, 2); // la base tal como la dejaba la versión anterior
          req.onupgradeneeded = function () {
            storesV2.forEach(function (n) { req.result.createObjectStore(n, { keyPath: "id" }); });
          };
          req.onsuccess = function () {
            var db = req.result;
            var tx = db.transaction(["diagnostico_resultados", "srs_cards", "xp", "plan"], "readwrite");
            tx.objectStore("diagnostico_resultados").put({ id: "1700000000000", porHabilidad: { lectura: { nivelCEFR: "B1" }, habla: { nivelCEFR: "A2" }, escucha: { nivelCEFR: "B1" }, escritura: { nivelCEFR: "A2" } } });
            tx.objectStore("srs_cards").put({ id: "voc-1", repeticiones: 5, intervaloDias: 14, facilidad: 2.2, proximaFecha: "2026-12-05" });
            tx.objectStore("xp").put({ id: "actual", total: 777 });
            tx.objectStore("plan").put({ id: "2026-11-17", pasos: [], totalMinutos: 0 });
            tx.oncomplete = function () { db.close(); resolve(); };
            tx.onerror = function () { reject(tx.error); };
          };
          req.onerror = function () { reject(req.error); };
        }).then(function () {
          instanciaV3 = storageReal.crear(nombre, 3); // abre con la versión nueva: dispara la migración
          return instanciaV3.openDB();
        }).then(function (db) {
          assertTrue(db.objectStoreNames.contains("avance"), "debe existir el store 'avance'");
          assertEqual(db.version, 3);
          return Promise.all([instanciaV3.get("srs_cards", "voc-1"), instanciaV3.get("xp", "actual"), instanciaV3.getAll("diagnostico_resultados"), instanciaV3.get("plan", "2026-11-17")]);
        }).then(function (res) {
          assertEqual(res[0].repeticiones, 5);
          assertEqual(res[0].intervaloDias, 14);
          assertEqual(res[1].total, 777);
          assertEqual(res[2].length, 1);
          assertTrue(!!res[3], "el plan guardado debe seguir ahí");
          // y la app, con esa base migrada, deriva el avance del diagnóstico existente (ventanas vacías)
          var antes = App.Storage;
          App.Storage = instanciaV3;
          return App.Datos.obtenerEstadosAvance().then(function (e) {
            App.Storage = antes;
            assertEqual(e.lectura.nivel, "B1");
            assertEqual(e.lectura.ventana.length, 0);
            assertEqual(App.Avance.porcentajeDeHabilidad(e.lectura), 0);
            return instanciaV3.exportBackup();
          });
        }).then(function (backup) {
          assertTrue(Array.isArray(backup.datos.avance), "el export de la base migrada trae 'avance'");
          return instanciaV3.eliminarBaseDeDatos();
        });
      });

      function correrTodo() {
        var lista = document.getElementById("lista-resultados");
        var resumen = document.getElementById("resumen");
        lista.innerHTML = "";
        resumen.textContent = "Corriendo…";
        App.Storage = storagePrueba; // a partir de aquí, App.Datos lee/escribe en la base de prueba
        var fetchReal = window.fetch;
        window.fetch = function (url, opciones) { return fetchReal("../" + url, opciones); };

        var pasaron = 0;
        var fallaron = 0;

        return pruebas
          .reduce(function (cadena, p) {
            return cadena.then(function () {
              return Promise.resolve()
                .then(p.fn)
                .then(function () {
                  pasaron++;
                  var li = document.createElement("li");
                  li.className = "ok";
                  li.innerHTML = "<span class=\"nombre\">✓ " + p.nombre + "</span>";
                  lista.appendChild(li);
                })
                .catch(function (err) {
                  fallaron++;
                  var li = document.createElement("li");
                  li.className = "fail";
                  var nombreSpan = document.createElement("span");
                  nombreSpan.className = "nombre";
                  nombreSpan.textContent = "✗ " + p.nombre;
                  var detalleSpan = document.createElement("span");
                  detalleSpan.className = "detalle";
                  detalleSpan.textContent = err && err.message ? err.message : String(err);
                  li.appendChild(nombreSpan);
                  li.appendChild(detalleSpan);
                  lista.appendChild(li);
                });
            });
          }, Promise.resolve())
          .then(function () {
            resumen.textContent = pasaron + " pasaron, " + fallaron + " fallaron (de " + pruebas.length + ")";
          })
          .then(function () {
            App.Storage = storageReal; // restaurar siempre, pase lo que pase
            window.fetch = fetchReal;
            return storagePrueba.eliminarBaseDeDatos();
          })
          .catch(function (err) {
            App.Storage = storageReal;
            window.fetch = fetchReal;
            resumen.textContent = "Error inesperado corriendo la batería: " + err.message;
          });
      }

      document.getElementById("btn-correr").addEventListener("click", function () {
        correrTodo();
      });
